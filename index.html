function gainXp(m,amt){const cp=capOf(m);if(m.lv>=cp)return'';m.xp+=amt;let up=0;while(m.lv<cp&&m.xp>=need(m.lv)){m.xp-=need(m.lv);m.lv++;up++;m.max+=8;m.hp=Math.min(m.max,m.hp+8);m.atk+=3;m.def+=2}if(m.lv>=cp)m.xp=0;return up?`⭐ ${m.n} 升到 Lv.${m.lv}${m.lv>=cp?(m.next?'（此階段滿等，可以進化了！）':'（滿等！）'):''}！`:''}
function awardXp(mu){const base=Math.round(mu*(1+g.badges*.25+g.world*1.5)),out=[];const lm=g.mons[g.lead];if(lm){const a=gainXp(lm,base);if(a)out.push(a)}return`<br>✨ 經驗值 +${base}（只有出戰的夥伴獲得）`+(out.length?'<br>'+out.join('<br>'):'')}
const lvLine=m=>{const cp=capOf(m);return`<small>Lv.${m.lv}／${cp}${m.lv>=cp?(m.next?' ⭐階段滿等，可進化':' ⭐MAX'):'　經驗 '+m.xp+'/'+need(m.lv)}</small>`+(m.lv>=cp?'':bar(m.xp,need(m.lv)))};
const QP=[{t:'win',d:'打贏 3 場戰鬥',n:3},{t:'catch',d:'捕捉 1 隻野生寶可夢',n:1},{t:'hatch',d:'孵化 1 顆蛋',n:1},{t:'step',d:'騎車探索 30 步',n:30},{t:'trainer',d:'打敗 1 位訓練家',n:1}];
const dayNo=()=>Math.floor((Date.now()+8*36e5)/864e5);
function qCheck(){const d=dayNo();if(g.q&&g.q.day===d)return;const s=d%5;g.q={day:d,bonus:false,list:[0,2,4].map(k=>Object.assign({h:0,done:false},QP[(s+k)%5]))}}
function qProg(t,n){qCheck();const q=g.q;q.list.forEach(x=>{if(x.t===t&&!x.done){x.h=Math.min(x.n,x.h+n);if(x.h>=x.n){x.done=true;g.candy+=2;g.food.cake+=2;g.money+=50;g.qm=(g.qm||'')+`<br>📋 任務完成：${x.d}！獲得 🍬×2 🍰×2 💰50`}}});if(!q.bonus&&q.list.every(x=>x.done)){q.bonus=true;g.candy+=3;g.eggs.push(newEgg());g.qm=(g.qm||'')+'<br>🎉 今日任務全部完成！額外獲得 🍬×3 和一顆蛋！'}}
const qDone=()=>{qCheck();return g.q.list.filter(x=>x.done).length};
function questView(){qCheck();const q=g.q;return hdr(BACK)+`<div class="card"><h2>📋 今日任務</h2><small>每天換新任務（台灣時間 0 點）。每個任務完成得 🍬×2 🍰×2 💰50；三個都完成，再送 🍬×3 和一顆蛋。</small></div>`+q.list.map(x=>`<div class="card ${x.done?'lead':''}"><b>${x.done?'✅ ':'⬜ '}${x.d}</b>${bar(x.h,x.n)}<small>${x.h}/${x.n}</small></div>`).join('')+`<div class="card"><small>${q.bonus?'🎉 今天全部完成，額外獎勵已領！':'全部完成的額外獎勵：🍬×3 ＋ 一顆蛋'}<br>🍬 經驗糖果持有 ${g.candy}（補給分頁使用，+1 級）</small></div>`}
function useCandy(i){const m=g.mons[i];if(!g.candy||m.lv>=MAXLV)return;g.candy--;const r=gainXp(m,need(m.lv)-m.xp);go('team',r||'🍬 吃了糖果！')}
function candyShop(){return `<div class="card"><h2>🍬 經驗糖果</h2><div class="row"><div class="mon sm">🍬</div><div class="grow"><b>經驗糖果</b> <small>+1 級（有 ${g.candy}）</small></div><button ${g.money<60?'disabled':''} onclick="buyCandy(1)">💰60</button><button class="s" ${g.money<300?'disabled':''} onclick="buyCandy(5)">×5</button></div></div>`}
function buyCandy(n){const c=60*n;if(g.money<c)return;g.money-=c;g.candy+=n;go('shop')}
function flee(){g.b=null;go('map','🏃 你離開了戰鬥。寶可夢的血量沒有恢復，記得吃蘋果或去 🏥 治療！')}
function act(a){
 const b=g.b,p=g.mons[g.lead],e=b.e;
 if(b.cd)b.cd--;
 b.guard=false;
 if(a==='atk'){let d=Math.max(1,p.atk-Math.floor(e.def/2)+rnd(4));if(p.trs.includes('fury'))d=Math.round(d*1.3);if(b.charge){d=Math.round(d*1.5);b.charge=false}const mu=mult(ty(p)[0],e.tp);d=Math.max(1,Math.round(d*mu));e.hp-=d;b.log.push(`⚔️ ${p.n} 攻擊，造成 ${d} 傷害！${eff(mu)}`);vamp(p,d,b)}
 else if(a==='big'){b.cd=3;if(!p.trs.includes('lucky')&&rnd(10)<3)b.log.push('💨 必殺技揮空了…');else{let d=Math.max(2,Math.round(p.atk*1.8)-Math.floor(e.def/2));if(b.charge){d=Math.round(d*1.5);b.charge=false}const mu=mult(ty(p)[1]||ty(p)[0],e.tp);d=Math.max(2,Math.round(d*mu));e.hp-=d;b.log.push(`💥 必殺技！造成 ${d} 傷害！${eff(mu)}`);vamp(p,d,b)}}
 else if(a==='ball'||a==='great'){if(!b.wild||!g[a])return;g[a]--;const ch=Math.min(.95,(a==='great'?.5:.3)+(1-e.hp/e.max)*.5);if(Math.random()<ch){const m2=mk(b.key,.9,'wild');g.mons.push(m2);g.b=null;qProg('catch',1);return go('map','🎉 抓到了 '+m2.n+' '+m2.e+'！已加入隊伍。<br><small>🌿 野生捕捉的能力比孵化的弱，可以多餵食物變強。</small>'+awardXp(10))}b.log.push('🔴 球搖了搖……掙脫了！')}else if(a==='heal'){g.food.apple--;const hl=Math.min(30,p.max-p.hp);p.hp+=hl;b.log.push(`🍎 ${p.n} 吃了蘋果，回復 ${hl} 血！`)}else{b.guard=true;b.charge=true;const hl=Math.ceil(p.max*.15);p.hp=Math.min(p.max,p.hp+hl);b.log.push(`🛡️ ${p.n} 防禦！回復 ${hl} 血，下次攻擊 +50%！`)}
 if(e.hp<=0)return win();
 let d=Math.max(1,e.atk-Math.floor(p.def/2)+rnd(3));const em=mult(e.tp[rnd(e.tp.length)],ty(p));d=Math.max(1,Math.round(d*em));if(b.guard)d=Math.ceil(d/2);if(p.trs.includes('counter'))d=Math.ceil(d/2);if(p.trs.includes('thick'))d=Math.max(1,d-2);
 p.hp-=d;b.log.push(`🔥 ${e.n} 反擊，你受到 ${d} 傷害！${eff(em)}`);
 if(p.trs.includes('counter')&&p.hp>0){const c=Math.max(1,Math.round((p.atk-Math.floor(e.def/2)+rnd(4))*mult(ty(p)[0],e.tp)));e.hp-=c;b.log.push(`🌀 以柔克剛！${p.n} 用招式反擊，造成 ${c} 傷害！`);if(e.hp<=0)return win()}
 if(p.hp<=0){const fee=Math.min(g.money,30);g.money-=fee;healAll();g.b=null;g.pos=HOME.slice();return go('map','😢 輸了…被送回小鎮的寶可夢中心，治療費 💰'+fee+'。吃點食物變強再來吧！')}
 draw();
}
function win(){
 const b=g.b,f=g.badges+g.world*8;
 const gold=(b.boss?80:b.wild?12:30)+f*(b.wild?3:6);g.money+=gold;
 let m=b.wild?`✅ 打倒了野生的 ${b.e.n}（牠昏過去了，沒辦法捕捉）獲得 💰${gold}`:`🎉 打敗了 ${b.tn}！獲得 💰${gold}`;
 m+=awardXp(b.boss?70:b.wild?20:35);qProg('win',1);if(!b.wild)qProg('trainer',1);if(rnd(100)<(b.boss?100:b.wild?25:40)){const cn=b.boss?2:1;g.candy+=cn;m+='<br>🍬 撿到經驗糖果×'+cn+'！'}
 if(b.wild){if(rnd(100)<30){g.food.cake++;m+='<br>🍰 撿到蛋糕！'}}
 else if(b.boss){
  g.badges++;m+=`<br>🏅 拿到第 ${g.badges} 枚徽章！`;
  if(g.badges>=8){g.badges=0;g.found=[];g.world++;g.b=null;g.pos=HOME.slice();g.seen={};mark(g,HOME[0],HOME[1]);return go('world')}
 }else{const eg=newEgg();g.eggs.push(eg);m+='<br>🥚 拿到 '+eg.n+'（要 🍰'+eg.need+' ，要到首頁的 🪺孵蛋所 放進孵蛋器）！';if(rnd(100)<25){const k=Object.keys(ST)[rnd(4)];g.stone[k]++;m+='<br>'+ST[k][0]+' 撿到 '+ST[k][1]+'！'}}
 g.b=null;go('map',m);
}
draw();
initCloud();
</script>
